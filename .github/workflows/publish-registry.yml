# Registry publish -- trusted publishing via GitHub OIDC.
# Copyright (c) 2026 Eleftherios Notas and The XIOM Authors
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Contract:
#   XIOM_REGISTRY=https://registry.xiom-lang.org (production) or
#   https://staging.registry.xiom-lang.org (dispatch canary).
#   Auth: GitHub OIDC trusted publishing. xiom-lang/stdlib is the trusted
#   publisher for the stdlib package (audience `xiom-registry`); production
#   refs are `refs/tags/stdlib-v*`, staging canaries are workflow_dispatch
#   runs. The JWT is minted in-job, masked, and passed to `xiom pkg publish`
#   as an opaque bearer via XIOM_REGISTRY_TOKEN. No long-lived publish token
#   exists.
#   The publish job runs in the `registry-publish` environment (required
#   reviewers).
#
# Inputs (dispatch): the stdlib release version (e.g. 0.60.0) and, for
# staging canaries, the registry base URL. On tag pushes the version comes
# from the tag (`stdlib-v*`). The compiler pin is read from COMPILER_VERSION
# at the matching stdlib tag; the compiler binary and the package tarball come
# from public GitHub Releases (no token).
#
# The workflow waits up to 15 minutes for the same-tag release asset (the
# release job may still be uploading) and generates an ephemeral ed25519 key
# immediately before publishing -- trusted first-party tokens require a valid
# signature (422 otherwise).
#
# Credentials policy: docs/CI.md.
name: XIOM Stdlib Registry Publish

on:
  push:
    tags: ["stdlib-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "stdlib release version to publish (e.g. 0.60.0)"
        required: true
      registry:
        description: "registry base URL"
        required: false
        default: "https://registry.xiom-lang.org"

permissions:
  contents: read

jobs:
  publish:
    name: xiom pkg publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: registry-publish
    steps:
      - name: Resolve versions
        id: ver
        run: |
          ver="${{ github.event.inputs.version }}"
          if [ -z "$ver" ]; then
            ver="${GITHUB_REF_NAME}"
          fi
          ver="${ver#stdlib-v}"
          pin="$(curl -fsSL "https://raw.githubusercontent.com/xiom-lang/stdlib/stdlib-v${ver}/COMPILER_VERSION" | tr -d '\r\n ')"
          if [ -z "$pin" ]; then
            echo "cannot resolve COMPILER_VERSION for stdlib-v${ver}" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "compiler=$pin" >> "$GITHUB_OUTPUT"
          echo "publishing stdlib $ver against compiler pin $pin"

      - name: Wait for the release asset (same-tag release job may still be uploading)
        run: |
          ver="${{ steps.ver.outputs.version }}"
          url="https://github.com/xiom-lang/stdlib/releases/download/stdlib-v${ver}/xiom-std-${ver}.tar.gz"
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -L "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "release asset ready: $url"
              exit 0
            fi
            echo "waiting for release asset (attempt $i/60, http $code)"
            sleep 15
          done
          echo "::error::release asset not available after 15 minutes: $url (re-run once the release job has uploaded it)"
          exit 1

      - name: Download stdlib package (public release asset)
        run: |
          ver="${{ steps.ver.outputs.version }}"
          mkdir -p pkg
          curl -fsSL -o "xiom-std-${ver}.tar.gz" \
            "https://github.com/xiom-lang/stdlib/releases/download/stdlib-v${ver}/xiom-std-${ver}.tar.gz"
          tar -xzf "xiom-std-${ver}.tar.gz" -C pkg
          test -f pkg/package.xi
          echo "package contents:"; ls -la pkg

      - name: Download compiler (public xiom release asset)
        run: |
          pin="${{ steps.ver.outputs.compiler }}"
          pv="${pin#v}"
          curl -fsSL -o xiom-compiler.tar.gz \
            "https://github.com/xiom-lang/xiom/releases/download/${pin}/xiom-${pv}-linux-x64.tar.gz"
          mkdir -p compiler
          tar -xzf xiom-compiler.tar.gz -C compiler
          if [ ! -x compiler/bin/xiom ]; then
            echo "compiler release asset has no bin/xiom" >&2
            exit 1
          fi
          echo "XIOM_BIN=$(realpath compiler/bin/xiom)" >> "$GITHUB_ENV"
          compiler/bin/xiom --version

      - name: Mint registry OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=xiom-registry" | jq -r .value)"
          test -n "$token" && test "$token" != "null"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate signing key (ephemeral per run)
        run: |
          # Trusted first-party tokens require a valid ed25519 signature
          # (422 otherwise). keygen writes $HOME/.xiom/keys/default.key and
          # `xiom pkg publish` auto-signs with it; the key is per-run.
          "$XIOM_BIN" pkg keygen

      - name: Publish to the registry
        working-directory: pkg
        env:
          XIOM_REGISTRY: ${{ github.event.inputs.registry || 'https://registry.xiom-lang.org' }}
          XIOM_REGISTRY_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          "$XIOM_BIN" pkg publish
