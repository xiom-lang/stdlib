#
# Composite action: checkout xiom-lang/xiom at a pinned ref and build the
# compiler binary (debug). Used by ci.yml, heavy.yml and release.yml so the
# acquisition logic lives in one place.
#
# Notes:
# - xiom-lang/xiom is PUBLIC: the cross-repo checkout is anonymous. Do NOT
#   add XIOM_CROSS_REPO_TOKEN here; it is not required (same pattern the
#   registry e2e uses).
# - Tags before the resource-asset fix (e3714884, 2026-09-17) cannot build on
#   Windows: crates/xiom/build.rs needs resource/img/xiom-icon.ico. The step
#   below pulls resource/ from main when the pinned tree lacks it.
name: Build XIOM compiler
description: Checkout xiom at a ref and build the xiom binary (debug).
inputs:
  ref:
    description: xiom ref (tag/branch/sha) to build
    required: true
  path:
    description: checkout directory for the compiler sources
    required: false
    default: .compiler-src
outputs:
  binary:
    description: path to the built compiler binary
    value: ${{ steps.resolve.outputs.binary }}
runs:
  using: composite
  steps:
    - name: Checkout compiler at the pin
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: xiom-lang/xiom
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}

    - name: Resource assets workaround (tags predating e3714884)
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ ! -f resource/img/xiom-icon.ico ]; then
          echo "resource/ missing at ${{ inputs.ref }}; pulling it from main"
          git fetch --depth=1 origin main
          git checkout origin/main -- resource
        fi

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

    - name: Cache cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/
          ${{ inputs.path }}/target/
        key: ${{ runner.os }}-compiler-${{ inputs.ref }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.path)) }}
        restore-keys: |
          ${{ runner.os }}-compiler-

    - name: Build xiom (debug)
      shell: bash
      working-directory: ${{ inputs.path }}
      run: cargo build --locked -p xiom

    - name: Resolve binary path
      id: resolve
      shell: bash
      run: |
        if [ -f "${{ inputs.path }}/target/debug/xiom.exe" ]; then
          echo "binary=${{ inputs.path }}/target/debug/xiom.exe" >> "$GITHUB_OUTPUT"
        else
          echo "binary=${{ inputs.path }}/target/debug/xiom" >> "$GITHUB_OUTPUT"
        fi
